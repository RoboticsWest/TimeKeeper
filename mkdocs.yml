# Project information
site_name: TimeKeeper
site_url: https://curtinfrc.github.io/TimeKeeper/
site_author: Curtin FRC
site_description: >-
  TimeKeeper is a time-tracking and attendance system for FIRST Robotics
  Competition teams: sessions, RFID-powered kiosk check-in, real-time
  statistics, leaderboards, achievements and Discord integration.
site_dir: _build

# Repository information
repo_name: CurtinFRC/TimeKeeper
repo_url: https://github.com/CurtinFRC/TimeKeeper/
edit_uri: edit/master/docs/
copyright: "© 2025-2026 Curtin FRC — TimeKeeper"

# Navigation
nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting_started/quickstart.md
      - Installation: getting_started/install.md
      - Running the Server: getting_started/server_reference.md
      - Configuration: getting_started/configuration.md
      - Deployment: getting_started/deployment.md
      - Architecture: getting_started/architecture.md
  - Using the App:
      - Overview: app/overview.md
      - Sessions & Calendar: app/sessions.md
      - Check-in & Attendance: app/attendance.md
      - Team Members & Locations: app/team.md
      - Leaderboard & Statistics: app/statistics.md
      - Achievements & Badges: app/achievements.md
      - Notifications & RSVP: app/notifications.md
  - Kiosk & RFID:
      - Kiosk Mode: kiosk/kiosk.md
      - RFID Tags & Readers: kiosk/rfid.md
      - Check-in Windows & Auto Checkout: kiosk/checkout.md
  - Admin:
      - Admin Quickstart: admin/quickstart.md
      - Settings Reference: admin/settings.md
      - Users, Roles & Permissions: admin/users.md
      - Maintenance & Reset: admin/maintenance.md
      - Import & Export: admin/import_export.md
  - Discord Bot: discord/discord.md
  - Support:
      - Bug Reports: support/bug_reports.md
      - Change Requests: support/change_requests.md
      - Q&A: https://github.com/CurtinFRC/TimeKeeper/discussions

# Theme (Zensical, modern variant)
theme:
  name: material
  variant: modern
  font:
    text: "Ubuntu"
    code: "Ubuntu Mono"
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    # dark theme
    - scheme: slate
      toggle:
        icon: lucide/moon-star
        name: Switch to light mode
      primary: blue
      accent: indigo
    # light theme
    - scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
      primary: blue
      accent: indigo
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: CurtinFRC
      repo: TimeKeeper
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Plugins
plugins:
  - search:
      lang: en

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CurtinFRC/TimeKeeper
      name: TimeKeeper on GitHub
