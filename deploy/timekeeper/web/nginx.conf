server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # GraphQL HTTP API
  location /graphql {
    proxy_pass http://timekeeper:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # GraphQL WebSocket subscriptions
  location /graphql/ws {
    proxy_pass http://timekeeper:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }

  # Health check
  location = /health {
    proxy_pass http://timekeeper:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Flutter WASM build
  location ~* \.wasm$ {
    default_type application/wasm;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    try_files $uri =404;
  }

  # Source maps aren't shipped in the release build; let them 404 instead of
  # falling through to index.html (which produces a noisy devtools parse error).
  location ~* \.map$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm;
}
