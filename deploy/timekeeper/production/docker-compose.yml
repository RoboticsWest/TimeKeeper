services:
  timekeeper:
    container_name: timekeeper
    image: ghcr.io/roboticswest/timekeeper:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # API-only: the web frontend (Flutter build) is served by the `web` nginx
    # service below, which forwards /graphql, /graphql/ws and /health here.
    entrypoint: ["/app/server", "--no-web"]
    environment:
      # Externally-managed Postgres instance, conventionally named `timekeeper-db`.
      DATABASE_URL: ${DATABASE_URL}
      TK_ADMIN_PASSWORD: ${TK_ADMIN_PASSWORD}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - proxy

  web:
    # Nginx serving the static Flutter web build, proxying API paths to the
    # `timekeeper` container so the whole stack is reachable on one origin.
    container_name: timekeeper-web
    image: ghcr.io/roboticswest/timekeeper-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - timekeeper
    networks:
      - proxy

networks:
  proxy:
    external: true
