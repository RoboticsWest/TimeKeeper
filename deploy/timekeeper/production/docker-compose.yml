services:
  timekeeper:
    container_name: timekeeper
    image: ghcr.io/roboticswest/timekeeper:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Externally-managed Postgres instance, conventionally named `timekeeper-db`.
      DATABASE_URL: ${DATABASE_URL}
      TK_ADMIN_PASSWORD: ${TK_ADMIN_PASSWORD}
      TK_PROXY_TOKEN: ${TK_PROXY_TOKEN}
      TK_PROXY_DOMAIN: ${TK_PROXY_DOMAIN}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - proxy
networks:
  proxy:
    external: true
