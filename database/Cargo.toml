[package]
name = "database"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
diesel = { version = "2", default-features = false, features = ["postgres_backend", "uuid", "chrono", "32-column-tables"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8", "async-connection-wrapper"] }
diesel_migrations = "2"
uuid = { version = "1.19.0", features = ["v7"] }

# diesel-async 0.5.2 uses futures_util::try_join! but doesn't request the feature that gates it —
# pull it in ourselves so feature unification covers the gap.
futures-util = { version = "0.3", features = ["async-await", "async-await-macro"] }

# Needed only for `spawn_blocking` in `migrate`.
tokio = { version = "1", features = ["rt"] }
