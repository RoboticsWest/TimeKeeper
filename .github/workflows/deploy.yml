name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "database/**"
      - "client/**"
      - "deploy/timekeeper/**"
      - ".github/workflows/deploy.yml"
      - "vars.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

jobs:
  # API image. The Flutter build is deliberately not in it — see build-web.
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The default `docker` buildx driver can't export a build cache; the
      # container driver this sets up can.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/timekeeper/Dockerfile
          push: true
          tags: ghcr.io/roboticswest/timekeeper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Static Flutter web build, uploaded to the server and served directly by Caddy.
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - working-directory: client
        run: flutter pub get

      - working-directory: client
        run: dart run flutter_launcher_icons

      - name: Read version from vars.yml
        id: vars
        run: |
          version=$(grep 'name: tk_version' vars.yml -A1 | grep 'value:' | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Versioned base-href: every asset gets a URL unique to this commit under /v/<sha>/.
      # That makes the whole release safe to cache forever and impossible to mix with a
      # fresh shell (no stale main.dart.js_*.part.js can be served next to a new one).
      - working-directory: client
        run: >-
          flutter build web --release --wasm --no-web-resources-cdn
          --base-href=/v/${{ github.sha }}/
          --dart-define=TK_VERSION=${{ steps.vars.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: client/build/web
          retention-days: 1

  deploy:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # Releases live one-per-commit under /v/<sha>/. A leftover of the same commit
      # from a retried deploy is cleared first; root is never wiped any more.
      - name: Prepare version directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            mkdir -p /srv/timekeeper/web/v
            rm -rf "/srv/timekeeper/web/v/${{ github.sha }}"
            mkdir -p "/srv/timekeeper/web/v/${{ github.sha }}"

      # Keeps the server's compose file identical to what's in git.
      - name: Upload compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy/timekeeper/docker-compose.yml"
          target: "/srv/timekeeper"
          strip_components: 2
          overwrite: true

      - name: Upload web build
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "web/*"
          target: "/srv/timekeeper/web/v/${{ github.sha }}"
          strip_components: 1
          overwrite: true

      # Swaps the root entry atomically (copy-to-temp + mv, so a torn index.html is
      # never served), then prunes every release dir but the newest two. The previous
      # release is kept one cycle so a client already running it can finish its lazy
      # loads instead of 404ing mid-session.
      - name: Activate version and prune old releases
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cp -p "/srv/timekeeper/web/v/${{ github.sha }}/index.html" /srv/timekeeper/web/index.html.new
            mv -f /srv/timekeeper/web/index.html.new /srv/timekeeper/web/index.html
            SAVE_RELEASES=2
            counter=0
            for d in $(ls -1dt /srv/timekeeper/web/v/*/ 2>/dev/null); do
              counter=$((counter + 1))
              if [ "$counter" -le "$SAVE_RELEASES" ]; then
                continue
              fi
              rm -rf "${d%/}"
            done

      - name: Roll out API container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_TAG,DATABASE_URL,TK_ADMIN_PASSWORD,GH_TOKEN,GH_ACTOR
          script: |
            set -e
            cat > /srv/timekeeper/.env <<ENVEOF
            IMAGE_TAG=${IMAGE_TAG}
            DATABASE_URL=${DATABASE_URL}
            TK_ADMIN_PASSWORD=${TK_ADMIN_PASSWORD}
            RUST_LOG=info
            ENVEOF
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            cd /srv/timekeeper
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
        env:
          IMAGE_TAG: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TK_ADMIN_PASSWORD: ${{ secrets.TK_ADMIN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
